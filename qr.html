<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Code - Pandit Ji Caterers</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Poppins', sans-serif;
    background: linear-gradient(135deg, #1a0000 0%, #8B0000 50%, #c0392b 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
  }

  .qr-card {
    background: white;
    border-radius: 30px;
    padding: 3rem 2.5rem;
    text-align: center;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 30px 80px rgba(0,0,0,0.5);
    position: relative;
    overflow: hidden;
  }

  .qr-card::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 8px;
    background: linear-gradient(90deg, #8B0000, #FF6B00, #FFB800, #FF6B00, #8B0000);
  }

  .shop-logo {
    font-size: 3rem;
    margin-bottom: 0.5rem;
  }

  .shop-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.6rem;
    font-weight: 900;
    color: #8B0000;
    line-height: 1.2;
    margin-bottom: 0.3rem;
  }

  .shop-tagline {
    color: #FF6B00;
    font-size: 0.85rem;
    font-weight: 500;
    letter-spacing: 1px;
    margin-bottom: 2rem;
  }

  .qr-wrapper {
    background: #FFF8F0;
    border: 3px solid #FFB800;
    border-radius: 20px;
    padding: 1.5rem;
    display: inline-block;
    margin: 0 auto;
    position: relative;
  }

  .qr-wrapper::before {
    content: '📱 SCAN ME';
    position: absolute;
    top: -14px;
    left: 50%;
    transform: translateX(-50%);
    background: #FFB800;
    color: #4A2000;
    font-size: 0.7rem;
    font-weight: 700;
    padding: 0.2rem 1rem;
    border-radius: 50px;
    letter-spacing: 1px;
    white-space: nowrap;
  }

  #qrcode {
    display: flex;
    justify-content: center;
  }

  #qrcode canvas, #qrcode img {
    border-radius: 8px;
  }

  .qr-benefits {
    margin-top: 2rem;
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
    text-align: left;
  }

  .benefit-item {
    display: flex;
    align-items: center;
    gap: 0.8rem;
    padding: 0.6rem 0.8rem;
    background: #FFF8F0;
    border-radius: 10px;
    border-left: 3px solid #FF6B00;
  }

  .benefit-item span:first-child { font-size: 1.2rem; }

  .benefit-item p {
    font-size: 0.8rem;
    color: #4A2000;
    font-weight: 500;
    flex: 1;
  }

  .benefit-item .benefit-tag {
    background: #8B0000;
    color: white;
    font-size: 0.65rem;
    font-weight: 700;
    padding: 0.2rem 0.5rem;
    border-radius: 6px;
    white-space: nowrap;
  }

  .url-display {
    margin-top: 1.5rem;
    padding: 0.8rem;
    background: #f5f5f5;
    border-radius: 10px;
    font-size: 0.75rem;
    color: #666;
    word-break: break-all;
  }

  .url-display strong { color: #8B0000; display: block; margin-bottom: 0.2rem; }

  .print-btn {
    margin-top: 1.5rem;
    background: linear-gradient(135deg, #8B0000, #c0392b);
    color: white;
    border: none;
    padding: 0.8rem 2rem;
    border-radius: 50px;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Poppins', sans-serif;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
  }

  .print-btn:hover { opacity: 0.9; }

  @media print {
    body { background: white; padding: 0; }
    .qr-card { box-shadow: none; }
    .print-btn { display: none; }
  }
</style>
</head>
<body>

<div class="qr-card">
  <div class="shop-logo">🪔</div>
  <div class="shop-name">Pandit Ji<br>Caterers & Sweets</div>
  <div class="shop-tagline">स्वाद जो दिल को छू जाए</div>

  <div class="qr-wrapper">
    <div id="qrcode"></div>
  </div>

  <div class="qr-benefits">
    <div class="benefit-item">
      <span>🎁</span>
      <p>Register karein & instant discount paaein</p>
      <span class="benefit-tag">10% OFF</span>
    </div>
    <div class="benefit-item">
      <span>🎂</span>
      <p>Birthday month mein special offer</p>
      <span class="benefit-tag">FREE Mithai</span>
    </div>
    <div class="benefit-item">
      <span>👥</span>
      <p>3 dost laayein aur earn karein</p>
      <span class="benefit-tag">₹200 Cash</span>
    </div>
    <div class="benefit-item">
      <span>⭐</span>
      <p>Loyalty points harbaar jodain</p>
      <span class="benefit-tag">Rewards</span>
    </div>
  </div>

  <div class="url-display">
    <strong>🔗 Direct Link:</strong>
    panditjicaterers.vercel.app
  </div>

  <button class="print-btn" onclick="window.print()">🖨️ Print QR Code</button>
</div>

<script>
  // Change this URL after deploying to Vercel
  const LANDING_PAGE_URL = window.location.href.replace('qr.html', 'index.html');
  
  new QRCode(document.getElementById("qrcode"), {
    text: LANDING_PAGE_URL,
    width: 200,
    height: 200,
    colorDark: "#8B0000",
    colorLight: "#FFF8F0",
    correctLevel: QRCode.CorrectLevel.H
  });
</script>

</body>
</html>
